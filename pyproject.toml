[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "repomedic"
version = "0.1.0"
description = "Analyze a software repository, identify problems, explain root causes, and safely apply fixes."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["repository", "health", "analysis", "cli", "developer-tools"]
dependencies = [
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov>=4.1",
]

[project.scripts]
repomedic = "repomedic.cli.main:cli"

[tool.setuptools.packages.find]
where = ["."]
include = ["repomedic*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
